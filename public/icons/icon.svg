<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#orbit)" stroke-width="12" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="90" fill="url(#orbit)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="70" fill="#070b19"/>
  <circle cx="360" cy="180" r="28" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="160" cy="330" r="18" fill="#d946ef" filter="url(#glow)"/>
</svg>

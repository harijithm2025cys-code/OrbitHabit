<!doctype html>
<html lang="en" class="dark" data-theme="dark-space">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050814" />
    <meta name="description" content="OrbitHabit - Offline 3D Habit and Daily Money Tracker" />
    <title>OrbitHabit — Offline Habit & Money Tracker</title>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('orbithabit_settings');
          var theme = 'dark-space';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state && parsed.state.theme) {
              var t = parsed.state.theme;
              if (t === 'amoled') theme = 'amoled';
              else if (t === 'cyber-light' || t === 'light') theme = 'cyber-light';
              else theme = 'dark-space';
            }
          }
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'cyber-light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark-space');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body class="bg-space-950 text-main antialiased select-none overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
